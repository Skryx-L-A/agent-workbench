# tmux config — agent workbench (Workbench grid block)
#
# Reproduces the visible-parallelism grid used by the Claude Workbench:
# pane titles/borders identify each agent, splits auto-arrange into a grid,
# and dead Claude panes (jetsam/OOM) self-revive.

# Pane titles visible so agents are identifiable — each pane gets a colored
# bullet (color = pane index) + role/name label; active pane border is green+bold
set -g pane-border-status top
set -g pane-border-format " #[fg=colour#{e|+|#{e|%|#{pane_index},6},2},bold]●#[default] #{?#{==:#{@wb_role},sidebar},DATEIEN,#{?#{==:#{@wb_role},orchestrator},◆ ORCHESTRATOR,#{pane_index} #{pane_title}}}#{?pane_active, ◀,} "
set -g pane-border-style "fg=colour246"
set -g pane-active-border-style "fg=colour114,bold"
set -g pane-border-lines heavy

# Auto-grid: whenever ANY split happens (incl. Claude agent-team teammates),
# rearrange into the predefined grid (sidebar left · orchestrator top · agents row)
set-hook -g after-split-window 'run-shell -b -d 1 "$HOME/.local/bin/wb-grid #{window_id}"'
set-hook -g pane-exited 'run-shell -b -d 1 "$HOME/.local/bin/wb-grid #{window_id}"'

# Revive a dead claude pane (jetsam/OOM) — respawn + resume conversation.
# Manual: prefix + R. Automatic: the pane-died hook below.
bind-key R run-shell "wb-revive '#{pane_id}'"

# Auto-revive: when a pane with remain-on-exit dies (jetsam/OOM SIGKILL), bring
# it back by itself instead of leaving a dead, un-interactable "frozen" pane.
# wb-autorevive guards against respawn storms (memory-pressure check) and crash
# loops (per-pane throttle); it no-ops on non-claude panes. -b so tmux stays
# responsive while it runs.
set-hook -g pane-died 'run-shell -b "$HOME/.local/bin/wb-autorevive #{hook_pane}"'

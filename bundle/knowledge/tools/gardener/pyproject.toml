[project]
name = "gardener"
version = "0.1.0"
description = "Brain-Gardener: nightly local sleep-cycle for the Knowledge vault (linking, consolidation, maintenance, audit)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gardener = "gardener.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gardener"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# cargo-mutants reads the source as text and does not evaluate `cfg`. A function that exists only for
# another platform is not compiled on the machine that runs the gate, so no test can fail for a change
# in it, and its mutants would always survive. The Windows build is checked by the cross build
# (`rust-gates-<linux-host>.sh <worktree> windows`) and, later, by the Windows test machine.
exclude_re = [
  "portable_key",
  # such-mcp, `src/pipe.rs`: the file is compiled on every system (`pub mod pipe;` in `src/lib.rs` has no `cfg`), and its
  # pure function `name_ok` stays in the run. Only the module `tausch` stands behind `cfg(windows)` (`src/pipe.rs:24`);
  # its 14 mutants are left out by this pattern (decision of 25.11.2026). The module `tausch` in `src/suche.rs` is the
  # Unix one and stays in the run.
  '^crates/such-mcp/src/pipe.rs:[0-9]+:[0-9]+: .*tausch::',
  # peerkanal: the files are compiled on every system, but these functions stand behind `cfg(windows)`: the method
  # `Verbindung::prozess_griff` (`src/lib.rs:269`, it returns a `BorrowedHandle`), `VerbindungKern::prozess_roh`
  # (`src/ablauf.rs:564`) and the `impl JobBezug` with `neu` and `oeffnen` (`src/vorgabe.rs:87`). Their 6 mutants are left
  # out by these patterns (decision of 25.11.2026); the rest of the three files stays in the run. A pattern with a line
  # that no longer fits leaves its mutant in the run, which then reports it as missed (the run fails closed).
  '^crates/peerkanal/src/lib.rs:270:9: replace Verbindung::prozess_griff ',
  '^crates/peerkanal/src/ablauf.rs:566:9: replace VerbindungKern<P>::prozess_roh ',
  '^crates/peerkanal/src/vorgabe.rs:(92|100):9: replace JobBezug::(neu|oeffnen) ',
  # peerkanal, Unix side (27.11.2026): code that the Linux gate never compiles. In `src/lib.rs` the branches behind
  # `cfg(not(unix))` of `Server::anlegen_mit`, `verbinden` and `verbinden_ohne_hallo` (each `!cfg!(windows)`); in `src/unix.rs`
  # the function `messen` for macOS (`LOCAL_PEERCRED`, line 62) and for other Unix systems (line 77). Their 6 mutants are left
  # out; the macOS function runs in the tests on the Mac (the case of the own client and the case without a uid).
  '^crates/peerkanal/src/lib.rs:(96:16|317:12|344:12): delete ! in ',
  '^crates/peerkanal/src/unix.rs:(63|78):5: replace messen ',
  # stelle (27.11.2026): `schluessel_h1` for systems without Unix (`src/lib.rs`, the body on line 44) is never compiled by
  # the Linux gate. The Unix function of the same name (line 37) stays in the run.
  '^crates/stelle/src/lib.rs:44:5: replace schluessel_h1 ',
  # stelle (27.11.2026): `main` of `werkbank-stelle` for systems without Unix (`src/bin/werkbank-stelle.rs`, line 24) is
  # never compiled by the Linux gate; the Unix `main` stays in the run (`tests/programm.rs`).
  '^crates/stelle/src/bin/werkbank-stelle.rs:24:5: replace main ',
  # stelle (27.11.2026): `huelle::vorgabe::lesen` opens the real `/` (line 74). In the user namespace of the gate `/` and
  # `/var` belong to the overflow account, so no default below them passes, and the case of a read from `/` cannot run
  # there; the mutant "always `None`" would survive. The walk itself (`lesen_ab`) and the parts of the path (`teile`) stay
  # in the run with their cases below a folder of the own user; the other mutants of `lesen` stay too.
  '^crates/stelle/src/huelle/vorgabe.rs:74:5: replace lesen -> Option<Vec<u8>> with None$',
]
# For the same reason the modules `src/sys/windows.rs` are left out: they stand behind `cfg(windows)` and are never compiled
# under Linux (decision of 25.11.2026). Their mutants run on the Windows test machine, before every delivery under Windows
# (open point in the contracts dienst and bruecke, section of the platforms).
exclude_globs = ["crates/*/src/sys/windows.rs"]

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Werkbank</title>
<link rel="icon" href="data:,">
<style>
/* Stile der Ansicht (Code-Ansicht der heutigen Werkbank, A157 Stufe 2a). Werte aus Anhang A der Inventur:
   werkbank.css und main/thema.ts der Electron-Werkbank, je Wert mit Fundstelle. Kein Code aus Electron.
   Die Palette 16 bis 255 schreibt buendeln.mjs an die Stelle der Marke PALETTE. */

:root {
  color-scheme: dark;
  /* Rollen, dunkel (thema.ts:53-84) */
  --fenster: #0b0d10; --grund: #101216; --leiste: #171a20; --erhoben: #1e232b; --linie: #262b34;
  --schrift: #d8dee9; --gedaempft: #8b93a1; --wahl: #222833; --tinte: #05070a;
  --fern: #6a7fd0; --laeuft: #46a758; --will: #e0a020; --aus: #d85858; --vorsichtgrund: #1a1315;
  /* Akzent: Rueckfall #0a84ff, Flaeche fuer weisse Tinte und Text gegen --wahl (thema.ts:271, :310-327, :198-215) */
  --akzent: #0070e0; --akzent-tinte: #ffffff; --akzent-text: #3398ff;
  /* Zustandsfarben (einstellungen.ts:343-348), lesbar gegen --erhoben (thema.ts:235) */
  --zustand-laeuft: #4ea1ff; --zustand-wartet: #e0a33e; --zustand-fertig: #3fa66a; --zustand-tot: #cd7979;
  /* Terminal: xterm DEFAULT_ANSI_COLORS (thema.ts:508-511) */
  --term-0: #2e3436; --term-1: #cc0000; --term-2: #4e9a06; --term-3: #c4a000;
  --term-4: #3465a4; --term-5: #75507b; --term-6: #06989a; --term-7: #d3d7cf;
  --term-8: #555753; --term-9: #ef2929; --term-10: #8ae234; --term-11: #fce94f;
  --term-12: #729fcf; --term-13: #ad7fa8; --term-14: #34e2e2; --term-15: #eeeeec;
  /* Masse (werkbank.css:41-80) */
  --titelhoehe: 40px; --kopfhoehe: 52px; --streifenhoehe: 34px; --statushoehe: 28px;
  --r-klein: 6px; --r-mittel: 8px; --r-karte: 10px; --fuge: 4px;
  --zeilenhoehe: 44px; --projektzeile: 32px;
  --links-breite: 232px; --rechts-breite: 360px;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --fenster: #dfe2e7; --grund: #ffffff; --leiste: #f4f5f7; --erhoben: #eceef2; --linie: #d8dbe1;
    --schrift: #1b1f27; --gedaempft: #5c6472; --wahl: #e4e8f4; --tinte: #ffffff;
    --fern: #3355c4; --laeuft: #22803c; --will: #9a6600; --aus: #b3261e; --vorsichtgrund: #fdf2f1;
    --akzent: #0070eb; --akzent-tinte: #ffffff; --akzent-text: #005dc2;
    --zustand-laeuft: #0063d3; --zustand-wartet: #8d6017; --zustand-fertig: #2e7a4e; --zustand-tot: #b24242;
    /* Terminal hell: jede Farbe lesbar gegen --erhoben, brightWhite = --schrift (thema.ts:513-522) */
    --term-0: #2e3436; --term-1: #cc0000; --term-2: #3a7304; --term-3: #725d00;
    --term-4: #3465a4; --term-5: #75507b; --term-6: #047173; --term-7: #626861;
    --term-8: #555753; --term-9: #cc0f0f; --term-10: #437611; --term-11: #695d02;
    --term-12: #386ca3; --term-13: #855580; --term-14: #117676; --term-15: #1b1f27;
  }
}
:root {
  --wartet-matt: color-mix(in srgb, var(--zustand-wartet) 14%, transparent);
  --wartet-rand: color-mix(in srgb, var(--zustand-wartet) 38%, transparent);
  --akzent-matt: color-mix(in srgb, var(--akzent) 15%, transparent);
  --term-cursor: color-mix(in srgb, var(--schrift) 72%, transparent);
  --raster-vorn: var(--schrift); --raster-grund: var(--erhoben);
}

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fenster); color: var(--schrift); }
body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
svg { display: block; }
h2, h3, p { margin: 0; }
:focus-visible, input:focus, select:focus { outline: 2px solid var(--akzent); outline-offset: 1px; }
.versteckt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.leise { color: var(--gedaempft); font-size: 11.5px; }

/* Noch nicht angebunden: sichtbar, nicht bedienbar; Name und Hinweis sagen es */
.nna { opacity: 0.5; cursor: not-allowed; }
/* Gesperrt nach Zustand (etwa „Beenden“ einer beendeten Sitzung): sieht aus wie die anderen gesperrten Bedienwege */
button:disabled:not(.nna):not(.gewaehlt) { opacity: 0.5; }
.nna-marke { font-size: 10.5px; font-weight: 400; color: var(--gedaempft); border: 1px dashed var(--linie);
  border-radius: 4px; padding: 0 4px; white-space: nowrap; flex: 0 0 auto; }
.nna-text { color: var(--gedaempft); text-decoration: underline dotted; text-underline-offset: 2px; }

/* Rahmen: Karten auf dunklerem Grund, 4 px Rand, 4 px Luecke, 10 px Radius (werkbank.css:61-62, :103-107) */
#wurzel { height: 100%; }
#rahmen { display: flex; flex-direction: column; height: 100vh; height: 100dvh; box-sizing: border-box;
  padding: var(--fuge); gap: var(--fuge); }

.punkt { width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; flex: 0 0 auto; }
.punkt.laeuft { background: var(--zustand-laeuft); }
.punkt.will { background: var(--zustand-wartet); box-shadow: 0 0 0 3px var(--wartet-matt); }
.punkt.ruhig { background: transparent; border: 1.5px solid var(--gedaempft); }
.punkt.aus { background: transparent; border: 1.5px solid var(--zustand-tot); }
.punkt.fertig { background: var(--zustand-fertig); }

/* Titelleiste (werkbank.css:164-190) */
#titelleiste { position: relative; flex: 0 0 auto; height: var(--titelhoehe); display: flex; align-items: center;
  gap: 9px; padding: 0 6px 0 10px; }
#kontext { display: flex; align-items: center; gap: 7px; min-width: 0; max-width: calc(50% - 100px); }
#k-projekt { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; }
#kontext .teiler { color: var(--gedaempft); }
#k-orch { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modi { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#titel-rechts { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
#freigabe-abzeichen { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 8px;
  margin-right: 3px; border-radius: 12px; background: var(--zustand-wartet); color: #000; font-size: 11.5px; font-weight: 600; }
#freigabe-abzeichen .zahl { font-variant-numeric: tabular-nums; }
#freigabe-abzeichen.leer { background: var(--erhoben); color: var(--gedaempft); font-weight: 500; }
#freigabe-abzeichen.leer svg { display: none; }
.knopf-schlicht { width: 28px; height: 26px; display: grid; place-items: center; border-radius: var(--r-klein); color: var(--gedaempft); }
.knopf-schlicht:hover:not(:disabled) { background: var(--erhoben); color: var(--schrift); }
.knopf-schlicht[aria-pressed='true'] { background: var(--akzent-matt); color: var(--akzent-text); }

.segment { display: flex; gap: 2px; padding: 2px; box-sizing: border-box; height: 26px; background: var(--erhoben); border-radius: var(--r-mittel); }
.segment button { display: flex; align-items: center; padding: 0 10px; border-radius: 6px; font-size: 11.5px;
  color: var(--gedaempft); white-space: nowrap; }
.segment button.gewaehlt { background: var(--grund); color: var(--schrift); font-weight: 500; opacity: 1; }
.segment.modi button.gewaehlt, .segment.wahl-akzent button.gewaehlt { background: var(--akzent); color: var(--akzent-tinte); }

/* Kanalwarnung und Freigabeleiste quer ueber die Breite (werkbank.css:1256-1261, :269-285) */
#kanalwarnung { flex: 0 0 auto; padding: 7px 12px; background: var(--vorsichtgrund); color: var(--aus); font-size: 12px;
  border-radius: var(--r-karte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#freigabeleiste { flex: 0 0 auto; background: var(--wartet-matt); border-radius: var(--r-karte); overflow: hidden; }
.fr-zeile { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 14px; }
.fr-marke { color: var(--zustand-wartet); flex: 0 0 auto; font-weight: 600; font-size: 11.5px; }
.fr-text { min-width: 0; flex: 1 1 auto; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr-wer { font-weight: 600; }
.fr-text .leise { font-size: 12.5px; }
.fr-knoepfe { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; flex-wrap: wrap; }
.fr-blaettern { display: flex; align-items: center; gap: 2px; color: var(--gedaempft); font-size: 11px; flex: 0 0 auto; }
.fr-blaettern button { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; }
.fr-zaehlung { font-variant-numeric: tabular-nums; padding: 0 3px; }
.fr-begruendung { padding: 0 14px 10px 40px; }
.fr-begruendung input { width: 100%; box-sizing: border-box; padding: 5px 8px; font: inherit; font-size: 12px;
  background: var(--erhoben); border: 0; border-radius: var(--r-klein); color: var(--schrift); }
.fr-karte { background: var(--erhoben); border-radius: var(--r-mittel); padding: 8px 10px; margin-bottom: 6px;
  box-shadow: inset 3px 0 0 var(--fern); }

.knopf-voll { padding: 4px 13px; border-radius: var(--r-klein); background: var(--akzent); color: var(--akzent-tinte);
  font-size: 12px; font-weight: 500; }
.knopf-rand { padding: 4px 13px; border-radius: var(--r-klein); background: var(--erhoben); color: var(--schrift);
  font-size: 12px; font-weight: 500; }
.knopf-rand:hover:not(:disabled) { background: var(--linie); }
.knopf-klein { padding: 2px 8px; border-radius: var(--r-klein); background: var(--erhoben); color: var(--schrift);
  font-size: 11.5px; white-space: nowrap; }
.knopf-klein:hover:not(:disabled) { background: var(--linie); }

/* Drei Spalten: linke Leiste, Mitte, Inspektor; die Griffe sind die 4-px-Fugen (werkbank.css:340, :355-358) */
#app { flex: 1 1 auto; min-height: 0; display: grid;
  grid-template-columns: var(--links-breite) var(--fuge) minmax(0, 1fr) var(--fuge) var(--rechts-breite);
  grid-template-rows: minmax(0, 1fr) auto; }
.griff { grid-row: 1 / 3; cursor: not-allowed; }
.griff:hover { background: var(--linie); }
#griff-links { grid-column: 2; }
#griff-rechts { grid-column: 4; }

#links { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  background: var(--leiste); border-radius: var(--r-karte) var(--r-karte) 0 0; }
.leiste-kopf { flex: 0 0 auto; display: flex; align-items: center; height: 26px; margin: 12px 12px 6px;
  font-size: 11.5px; font-weight: 600; color: var(--gedaempft); }
.leiste-kopf .titel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#neue-session { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center;
  border-radius: var(--r-klein); color: var(--gedaempft); flex: 0 0 auto; }
#neue-session:hover { background: var(--erhoben); color: var(--schrift); }
#sessions { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 0 0 12px; }
.baum-leer { padding: 12px; color: var(--gedaempft); font-size: 11.5px; line-height: 1.5; }
.projekt-zeile, .gespraech-zeile { display: flex; align-items: center; gap: 8px; box-sizing: border-box; margin: 0 6px 1px;
  height: var(--projektzeile); padding: 0 8px; border-radius: var(--r-mittel); }
.projekt-zeile .pfeil { color: var(--gedaempft); transform: rotate(90deg); }
.projekt-zeile .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.projekt-zeile .anzahl { margin-left: auto; font-size: 11.5px; color: var(--gedaempft); font-variant-numeric: tabular-nums; }
.gespraech-zeile { margin-top: 6px; color: var(--gedaempft); height: auto; min-height: var(--projektzeile); flex-wrap: wrap;
  row-gap: 2px; padding-top: 4px; padding-bottom: 4px; }
.gespraech-zeile .name { flex: 0 0 auto; font-size: 12.5px; white-space: nowrap; }
.zeilensymbol { flex: 0 0 auto; color: var(--gedaempft); display: flex; }
#liste { list-style: none; margin: 0; padding: 0 6px; }
#liste li { margin: 0 0 1px; }
.orch-zeile { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; height: var(--zeilenhoehe);
  padding: 0 8px 0 22px; border-radius: var(--r-mittel); text-align: left; }
.orch-zeile:hover { background: var(--erhoben); }
.orch-zeile.gewaehlt { background: var(--akzent-matt); }
.orch-zeile.gewaehlt .name { color: var(--akzent-text); font-weight: 600; }
.zeilenleib { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
.orch-zeile .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orch-zeile .zusatz { font-size: 11.5px; color: var(--gedaempft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orch-zeile[data-zustand='beendet'] .zusatz { color: var(--zustand-tot); }

/* Fuss der linken Leiste: Maschinenkarte und Statuszeile (werkbank.css:1038-1100) */
#links-fuss { grid-column: 1; grid-row: 2; background: var(--leiste); border-radius: 0 0 var(--r-karte) var(--r-karte); }
#maschinen { display: flex; flex-direction: column; gap: 4px; padding: 4px 6px 0; }
.masch { display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: var(--r-karte);
  background: var(--erhoben); font-size: 11.5px; color: var(--gedaempft); }
.masch.nna { opacity: 0.7; }
.masch-kopf { display: flex; align-items: center; gap: 4px 8px; min-width: 0; flex-wrap: wrap; }
.masch-name { flex: 0 1 auto; min-width: 0; color: var(--schrift); font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masch-schalter { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
#statusleiste { box-sizing: border-box; min-height: var(--statushoehe); display: flex; flex-direction: column; gap: 4px;
  padding: 6px 12px 10px; font-size: 11.5px; color: var(--gedaempft); }
#statusleiste .rechts { display: flex; align-items: center; gap: 6px; min-height: 22px; }
#statusleiste .stueck { display: flex; align-items: center; gap: 6px; white-space: nowrap; margin-right: auto; }
#statusleiste .knopf { width: 24px; height: 22px; display: grid; place-items: center; border-radius: var(--r-klein); color: var(--gedaempft); }
#statusleiste .knopf:hover:not(:disabled) { background: var(--erhoben); color: var(--schrift); }
.sz-stueck { display: flex; align-items: center; gap: 6px; padding: 1px 4px; margin-left: -4px; border-radius: 4px;
  font-size: 11.5px; color: var(--gedaempft); align-self: flex-start; }
.sz-marke { width: 7px; height: 7px; border-radius: 2px; background: var(--gedaempft); }

/* Mitte (werkbank.css:533-605, :629-680) */
#mitte { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--grund); border-radius: var(--r-karte); overflow: hidden; }
#inhaltskopf { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; min-height: var(--kopfhoehe);
  box-sizing: border-box; padding: 8px 300px 8px 12px; }
#ik-links { min-width: 180px; flex: 1 1 180px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#ik-name { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.2; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
#ik-herkunft { font-family: var(--mono); font-size: 11.5px; color: var(--gedaempft); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ik-rechts { grid-column: 3; grid-row: 1; align-self: start; justify-self: end; z-index: 3; margin: 13px 12px 0 0;
  display: flex; align-items: center; gap: 8px; }
.statuspille { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px;
  background: var(--erhoben); color: var(--gedaempft); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.statuspille.aktiv, .statuspille:hover { color: var(--schrift); }
.statuspille[aria-expanded='true'] { background: var(--akzent-matt); color: var(--akzent-text); }
#ik-zahnrad { width: 26px; height: 26px; border-radius: var(--r-mittel); }
#tabstreifen, #editorzeile { flex: 0 0 auto; display: flex; align-items: stretch; gap: 6px; height: var(--streifenhoehe); padding: 0 12px; }
#editorzeile { height: 30px; align-items: center; }
#tabs { display: flex; align-items: stretch; gap: 2px; min-width: 0; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 10px; margin: 4px 0; border-radius: var(--r-mittel);
  font-size: 11.5px; color: var(--gedaempft); white-space: nowrap; }
.tab.gewaehlt { background: var(--erhoben); color: var(--schrift); font-weight: 500; }
.tab .anzahl { color: var(--gedaempft); font-variant-numeric: tabular-nums; }
#hinweis { display: flex; align-items: center; min-width: 0; padding: 0 4px; font-size: 11px; white-space: nowrap; overflow: hidden; }
.streifen-rechts { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
#ordnen { display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--r-mittel);
  background: var(--erhoben); font-size: 11.5px; color: var(--gedaempft); }
.etab { display: flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--r-mittel); font-size: 11.5px;
  color: var(--gedaempft); white-space: nowrap; }
.etab.gewaehlt { color: var(--schrift); font-weight: 500; box-shadow: inset 0 -2px 0 var(--laeuft); border-radius: 0; }

/* Buehne und Terminal-Pane (werkbank.css:705-760; paneflaeche.ts:241-256) */
#buehne { flex: 1 1 auto; position: relative; min-height: 0; display: flex; flex-direction: column; gap: var(--fuge);
  padding: 0 var(--fuge); background: var(--grund); }
.panekasten { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden;
  background: var(--erhoben); border-radius: var(--r-karte); }
.panekopf { flex: 0 0 22px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; padding: 0 4px 0 10px;
  min-width: 0; overflow: hidden; background: var(--leiste); font-size: 11.5px; }
.panekopf.aktiv { background: var(--akzent-matt); }
.panekopf .pk-name { font-weight: 600; white-space: nowrap; background: var(--akzent); color: var(--akzent-tinte);
  border-radius: 999px; padding: 1px 8px; margin-left: -2px; }
.panekopf .pk-modell, .panekopf .pk-tokens { font-family: var(--mono); font-size: 10.5px; color: var(--gedaempft); white-space: nowrap; }
.panekopf .pk-tokens { margin-left: auto; }
.pk-knopf { width: 20px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--gedaempft); }

.terminal { position: relative; flex: 1 1 auto; min-height: 0; background: var(--raster-grund); color: var(--raster-vorn); }
.terminal:focus-within { outline: 3px solid var(--akzent); outline-offset: -3px; }
.terminal.invers { --raster-vorn: var(--erhoben); --raster-grund: var(--schrift); }
.raster { position: absolute; inset: 0; overflow: auto; padding: 6px 10px; box-sizing: border-box;
  font-family: var(--mono); font-size: 13px; line-height: 17px; cursor: text; -webkit-font-smoothing: antialiased; }
.raster-inhalt { position: relative; width: max-content; min-width: 100%; }
.raster-zeile { white-space: pre; height: 17px; }
.cursor { position: absolute; width: 1ch; height: 17px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--term-cursor); pointer-events: none; }
.terminal:focus-within .cursor { background: var(--term-cursor); box-shadow: none; }
.cursor[hidden] { display: none; }
.eingang { position: absolute; width: 1ch; height: 17px; margin: 0; padding: 0; border: 0; opacity: 0; resize: none;
  overflow: hidden; outline: none; background: transparent; color: transparent; caret-color: transparent; font: inherit; }
.messung { position: absolute; left: 0; top: 0; visibility: hidden; white-space: pre; pointer-events: none; }
#leer { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 24px; text-align: center;
  color: var(--gedaempft); font-size: 12.5px; pointer-events: none; }
.dialog-leiste { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: var(--r-karte);
  background: var(--wartet-matt); }

.eingabezeile { flex: 0 0 auto; display: flex; gap: 8px; padding: 8px 12px; }
.feld { font: inherit; font-size: 12.5px; color: var(--schrift); background: var(--grund); border: 1px solid var(--linie);
  border-radius: var(--r-klein); padding: 5px 8px; min-height: 28px; box-sizing: border-box; min-width: 0; }
.eingabezeile .feld { flex: 1 1 auto; background: var(--erhoben); border-color: transparent; }
.fehler { display: flex; align-items: baseline; gap: 8px; margin: 0 12px 8px; padding: 7px 12px; border-radius: var(--r-mittel);
  background: var(--vorsichtgrund); color: var(--aus); font-size: 12px; }
.fehler[hidden] { display: none; }
.fehler-marke { font-weight: 600; }
.fehler-code { font-family: var(--mono); font-size: 10.5px; margin-left: auto; }

/* Rechte Spalte: Fenster Neue Sitzung und Inspektor (werkbank.css:960-1000) */
#rechts { grid-column: 5; grid-row: 1 / 3; display: flex; flex-direction: column; gap: var(--fuge); min-height: 0; overflow-y: auto; }
.karte-start, .inspektor { background: var(--leiste); border-radius: var(--r-karte); }
.karte-start { flex: 0 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.karte-titel { font-size: 13px; font-weight: 600; }
.karte-untertitel { font-size: 11.5px; font-weight: 600; color: var(--gedaempft); margin: 8px 0 4px; }
.start-zusatz { display: flex; flex-direction: column; gap: 6px; }
.start-zusatz .zeile { display: flex; gap: 6px; }
.start-zusatz .zeile .feld { flex: 1 1 auto; }
.start { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.feldgruppe { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.feldgruppe-breit, .knopf-haupt { grid-column: 1 / -1; }
.beschriftung { font-size: 11.5px; color: var(--gedaempft); }
.knopf-haupt { padding: 6px 13px; }
.breit { width: 100%; }
.modellwahl { display: flex; flex-direction: column; gap: 6px; }
.fruehere { display: flex; flex-direction: column; gap: 2px; }
.frueher { display: flex; align-items: center; gap: 6px; min-height: 28px; flex-wrap: wrap; }
.frueher .name { font-size: 12.5px; }
.frueher .zusatz { font-size: 11px; color: var(--gedaempft); margin-right: auto; }
.inspektor { flex: 1 0 160px; display: flex; flex-direction: column; min-height: 160px; }
.insp-reiter { flex: 0 0 auto; display: flex; gap: 2px; padding: 2px; margin: 12px 12px 6px; background: var(--erhoben); border-radius: var(--r-mittel); }
.insp-reiter .knopf { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; height: 22px;
  padding: 0 4px; border-radius: 6px; font-size: 11.5px; color: var(--gedaempft); white-space: nowrap; overflow: hidden; }
.insp-reiter .knopf.gewaehlt { background: var(--grund); color: var(--schrift); font-weight: 500; }
.insp-inhalt { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.sk-liste { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 11.5px; }
.sk-liste dt { color: var(--gedaempft); }
.sk-liste dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }

/* Blaetter ueber der Flaeche (werkbank.css:1170-1213) und Kontextmenue */
.blatt-grund, .menue-grund { position: fixed; inset: 0; z-index: 19; }
.blatt { position: fixed; right: 16px; top: 56px; z-index: 20; box-sizing: border-box; width: min(380px, calc(100% - 32px));
  max-height: calc(100% - 80px); overflow-y: auto; padding: 12px; background: var(--leiste); border-radius: var(--r-karte);
  box-shadow: 0 8px 24px color-mix(in srgb, var(--tinte) 22%, transparent); display: flex; flex-direction: column; gap: 6px; }
.sk-kopf { display: flex; align-items: center; gap: 8px; }
.sk-titel { font-weight: 600; margin-right: auto; }
.segment.seiten { height: auto; flex-wrap: wrap; }
.optionen { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.option { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.option .nna-marke { margin-left: auto; }
.worker-zeile { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.worker-zeile .wname { font-size: 12px; font-weight: 500; }
.worker-zeile .wmodell { font-family: var(--mono); font-size: 10.5px; color: var(--gedaempft); }
.menue { position: fixed; z-index: 30; min-width: 240px; padding: 4px; background: var(--leiste); border-radius: var(--r-mittel);
  box-shadow: 0 8px 24px color-mix(in srgb, var(--tinte) 30%, transparent); display: flex; flex-direction: column; }
.menue button { display: flex; align-items: center; gap: 8px; justify-content: space-between; text-align: left; padding: 6px 10px;
  border-radius: 6px; font-size: 13px; }
.menue button:hover:not(:disabled) { background: var(--akzent); color: var(--akzent-tinte); }
/* Kurzmeldung: unten mittig in der Mitte, über der Eingabezeile, nicht auf ihr (werkbank.css:1242-1247) */
.notiz-anker { position: relative; flex: 0 0 auto; height: 0; }
#notiz { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 25; max-width: 80%; width: max-content; padding: 6px 14px;
  border-radius: 14px; background: var(--erhoben); font-size: 12.5px; box-shadow: 0 4px 12px color-mix(in srgb, var(--tinte) 22%, transparent); }
#notiz[hidden] { display: none; }

/* Schmalere Fenster: Inspektor schmaler (Grenzen 280 bis 900, renderer.ts:2653) */
@media (max-width: 1150px) { :root { --rechts-breite: 300px; } }

/* Handybreite: eine Spalte, kein Querscrollen, Ziele mindestens 44 px (Vertrag seite SE5) */
@media (max-width: 900px) {
  html, body { height: auto; overflow-x: hidden; overflow-y: auto; }
  #rahmen { height: auto; min-height: 100dvh; }
  #titelleiste { height: auto; min-height: var(--titelhoehe); flex-wrap: wrap; }
  #kontext { max-width: none; flex: 1 1 auto; }
  .modi { position: static; transform: none; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(420px, 70dvh) auto auto; row-gap: var(--fuge); }
  #links { grid-row: 1; grid-column: 1; border-radius: var(--r-karte); max-height: 45dvh; }
  #ik-rechts { grid-row: 2; grid-column: 1; justify-self: stretch; margin: 0; padding: 4px; flex-wrap: wrap;
    background: var(--grund); border-radius: var(--r-karte); }
  #mitte { grid-row: 3; grid-column: 1; }
  #rechts { grid-row: 4; grid-column: 1; overflow: visible; }
  #links-fuss { grid-row: 5; grid-column: 1; border-radius: var(--r-karte); }
  .griff, .inspektor, #tabstreifen, #editorzeile, #maschinen, .pk-knopf { display: none; }
  #inhaltskopf { padding-right: 12px; }
  #rahmen button, #rahmen input, #rahmen select { min-height: 44px; min-width: 44px; }
  .segment { height: auto; }
  .fr-blaettern button { width: 44px; height: 44px; }
  #freigabe-abzeichen { height: 44px; }
  #statusleiste .knopf, #neue-session, .knopf-schlicht { width: 44px; height: 44px; }
  .leiste-kopf { height: 44px; }
}

[package]
name = "start"
version = "0.1.0"
description = "Start structure of a session (contract 1): reading of the request and the start file, checks against the settings file."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# einstellungen: the settings file, its typed view and the strict JSON reader (shared with contract 1).
# serde_json is used only by the outside tests, which read the case files of rust/spec/start.
[dependencies]
einstellungen = { path = "../einstellungen" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

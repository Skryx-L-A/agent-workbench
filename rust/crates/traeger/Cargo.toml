[package]
name = "traeger"
version = "0.1.0"
description = "Carrier of the new session view: one PTY and one screen grid per session; child bytes in, events of the state core out."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tr"
path = "src/main.rs"

# alacritty_terminal: the terminal grid (parser, scrollback, device query answers), pinned to the version the contract
# was measured with. portable-pty: the PTY and the child process (Unix and ConPTY). serde_json: the events as JSON values
# for the program `tr` (the case runner); the library API itself is plain Rust types.
[dependencies]
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
serde_json = "1"

[lints]
workspace = true

[package]
name = "such-mcp"
version = "0.1.0"
description = "Thin MCP tool over stdio: hands the questions of the agent to the search socket of its session."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "such-mcp"
path = "src/main.rs"

# serde_json: reads the JSON-RPC line and the arguments of the call, writes the escaped strings of the answer.
# No other dependency on every system: the socket is std::os::unix::net, the deadline is std::sync::mpsc. Under macOS `nix`
# comes in (below), under Windows `peerkanal`, nothing else (test
# `the_manifest_names_serde_json_everywhere_nix_only_under_macos_and_peerkanal_only_under_windows`).
[dependencies]
serde_json = "1"

# nix (macOS only; `socket` and `user` carry `getpeereid` and `geteuid`): the check of the server after `connect` under
# macOS (addendum to contract 4, section 6). No FFI of our own: `unsafe_code` is forbidden.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.28", default-features = false, features = ["socket", "user"] }

# peerkanal (path, crate of the workspace; no new package; Windows only): the named pipe of the session under Windows, with the
# check of the owner of the instance and the hello (addendum to contract 4 for Windows, section 6). No FFI of our own: the
# Win32 calls live in `peerkanal` alone.
[target.'cfg(windows)'.dependencies]
peerkanal = { path = "../peerkanal" }

[lints]
workspace = true
